      MaxRetries: 0
      DefaultArguments:
        --enable-glue-datacatalog: "true"
        --enable-metrics: "true"
        --enable-continuous-cloudwatch-log: "true"
        --job-language: python
        --extra-py-files: !Sub "s3://${LakehouseBucketName}/scripts/glue/lakehouse_utils.py"
        --lake_root: !Sub "s3://${LakehouseBucketName}"

  GoldJob:
    Type: AWS::Glue::Job
    Properties:
      Name: cms-gold
      Description: "silver -> gold marts (Spark SQL)"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/cms-lakehouse-glue-role"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${LakehouseBucketName}/scripts/glue/gold.py"
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: 3
      Timeout: 30
      MaxRetries: 0
      DefaultArguments:
        --enable-glue-datacatalog: "true"
        --enable-metrics: "true"
        --enable-continuous-cloudwatch-log: "true"
        --job-language: python
        --extra-py-files: !Sub "s3://${LakehouseBucketName}/scripts/glue/lakehouse_utils.py"
        --lake_root: !Sub "s3://${LakehouseBucketName}"

  # --- Orchestration: Glue Workflow ------------------------------------------------

  Workflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: cms-lakehouse-pipeline
      Description: Monthly - ingest, bronze (21 jobs in parallel), silver, gold.
      MaxConcurrentRuns: 1

  StartTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: cms-start-monthly
      Type: SCHEDULED
      Schedule: !Ref Schedule
      StartOnCreation: true
      WorkflowName: !Ref Workflow
      Actions:
        - JobName: !Ref IngestJob

  BronzeTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: cms-after-ingest
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref Workflow
      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref IngestJob
            State: SUCCEEDED
      Actions:
        - JobName: !Ref BronzeNhProviderInfoJob
        - JobName: !Ref BronzeNhOwnershipJob
        - JobName: !Ref BronzeNhPenaltiesJob
        - JobName: !Ref BronzeNhHealthCitationsJob
        - JobName: !Ref BronzeNhFireSafetyCitationsJob
        - JobName: !Ref BronzeNhCitationDescriptionsJob
        - JobName: !Ref BronzeNhSurveyDatesJob
        - JobName: !Ref BronzeNhSurveySummaryJob
        - JobName: !Ref BronzeNhQualityMeasuresMdsJob
        - JobName: !Ref BronzeNhQualityMeasuresClaimsJob
        - JobName: !Ref BronzeNhStateUsAveragesJob
        - JobName: !Ref BronzeNhHealthInspectionCutpointsStateJob
        - JobName: !Ref BronzeNhDataCollectionIntervalsJob
        - JobName: !Ref BronzeNhCovidVaxProviderJob
        - JobName: !Ref BronzeNhCovidVaxAveragesJob
        - JobName: !Ref BronzeSnfVbpFacilityPerformanceJob
        - JobName: !Ref BronzeSnfVbpAggregatePerformanceJob
        - JobName: !Ref BronzeSnfQrpProviderJob
        - JobName: !Ref BronzeSnfQrpNationalJob
        - JobName: !Ref BronzeSwingBedSnfJob
        - JobName: !Ref BronzePbjDailyNurseStaffingJob

  SilverTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: cms-after-bronze
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref Workflow
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhProviderInfoJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhOwnershipJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhPenaltiesJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhHealthCitationsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhFireSafetyCitationsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhCitationDescriptionsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhSurveyDatesJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhSurveySummaryJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhQualityMeasuresMdsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhQualityMeasuresClaimsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhStateUsAveragesJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhHealthInspectionCutpointsStateJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhDataCollectionIntervalsJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhCovidVaxProviderJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeNhCovidVaxAveragesJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeSnfVbpFacilityPerformanceJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeSnfVbpAggregatePerformanceJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeSnfQrpProviderJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeSnfQrpNationalJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeSwingBedSnfJob
            State: SUCCEEDED
          - LogicalOperator: EQUALS
            JobName: !Ref BronzePbjDailyNurseStaffingJob
            State: SUCCEEDED
      Actions:
        - JobName: !Ref SilverJob

  GoldTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: cms-after-silver
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref Workflow
      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref SilverJob
            State: SUCCEEDED
      Actions:
        - JobName: !Ref GoldJob

  # --- Dashboard: read-only IAM user (keys created in the console) ------------------

  DashboardUser:
    Type: AWS::IAM::User
    Properties:
      UserName: cms-dashboard-reader
      Policies:
        - PolicyName: athena-gold-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunQueriesInOneWorkgroup
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/cms_lakehouse"
              - Sid: ReadGoldCatalog
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/cms_gold"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/cms_gold/*"
              - Sid: ReadGoldData
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${LakehouseBucketName}/gold/*"
              - Sid: QueryResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::${LakehouseBucketName}/athena-results/*"
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${LakehouseBucketName}"

Outputs:
  WorkflowName:
    Value: !Ref Workflow
  DashboardUser:
    Value: !Ref DashboardUser
